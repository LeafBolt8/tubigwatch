name: antislop

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  antislop:
    name: anti-slop guardrail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Fails the job on any detected violation, so the bans block a merge.
      - name: Check UI source against the anti-slop bans
        run: node scripts/check-antislop.mjs

      - name: Test the guardrail itself
        run: node --test scripts/*.test.mjs
